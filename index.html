<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --rosa:#E8609C; --rosa-hondo:#C9437F; --rosa-claro:#FCE6F0; --papel:#FFF8FB;
  --marino:#17223B; --tinta:#22222A; --gris:#6E6A75; --linea:#EFD3E0;
  --ok:#23845A; --mal:#C23B3B;
  --brush:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --texto:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cordon:repeating-linear-gradient(135deg,var(--rosa) 0 5px,var(--marino) 5px 8px);
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--texto);color:var(--tinta);background:var(--papel);font-size:16px;line-height:1.45;touch-action:manipulation;padding-bottom:calc(92px + var(--bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marino);outline-offset:2px}

/* Encabezado */
.top{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;position:sticky;top:0;z-index:20;background:var(--rosa);padding:calc(8px + var(--top)) 14px 8px;display:flex;align-items:center;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;background:var(--cordon)}
.logo{touch-action:none;cursor:pointer;width:62px;height:62px;border-radius:50%;border:3px solid var(--marino);background:#fff;object-fit:cover;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:none}
.marca{flex:1;min-width:0}
.marca h1{margin:0;font-family:var(--brush);font-weight:400;font-size:34px;line-height:1;color:#fff;text-shadow:2px 2px 0 var(--marino)}
.marca p{margin:2px 0 0;font-size:13px;font-weight:700;color:var(--marino);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.salir{display:none;background:var(--marino);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px}
body.admin .salir{display:block}
body.admin .marca p::after{content:" · admin"}

main{max-width:1100px;margin:0 auto;padding:26px 12px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.version{text-align:center;font-size:11px;color:#C9B7C1;padding:18px 0 0}
.aviso{text-align:center;color:var(--gris);padding:48px 16px;font-weight:600}

/* Producto */
.prod{background:#fff;border:2px solid var(--marino);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.prod.agotado .fotos{filter:grayscale(.7);opacity:.7}
.fotos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:1/1;background:var(--rosa-claro);scrollbar-width:none}
.fotos::-webkit-scrollbar{display:none}
.fotos img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:5px;margin-top:-18px;height:18px;position:relative;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.55;box-shadow:0 0 0 1px rgba(23,34,59,.4)}
.dots i.on{opacity:1;background:var(--rosa)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-family:var(--brush);font-weight:400;font-size:24px;line-height:1.05;color:var(--marino)}
.precio{font-size:20px;font-weight:800}
.stock{font-size:13px;font-weight:700;color:var(--ok)}
.stock.cero{color:var(--mal)}
.stock.poco{color:#B26A00}
.carac{margin:2px 0 0;font-size:14px;color:var(--gris);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.carac.abierta{-webkit-line-clamp:unset;display:block}
.mas{background:none;border:0;padding:0;color:var(--rosa-hondo);font-weight:800;font-size:13px;align-self:flex-start}
.encarrito{font-size:13px;font-weight:700;color:var(--rosa-hondo)}
.agregar{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--rosa);color:#fff;border:2px solid var(--marino);border-radius:999px;padding:9px 10px;font-weight:800;font-size:14px}
.agregar b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--marino);font-size:18px;line-height:1}
.agregar:disabled{background:#E7E2E8;color:var(--gris);border-color:#CFC8D2}
.agregar:disabled b{background:#B9B1BD}
.agregar.pum{animation:pum .3s}
@keyframes pum{50%{transform:scale(.94)}}

/* Controles de administración en tarjeta */
.adm{display:none;margin-top:auto;flex-direction:column;gap:8px}
body.admin .adm{display:flex}
body.admin .agregar,body.admin .encarrito{display:none}
.paso{display:flex;align-items:center;border:2px solid var(--marino);border-radius:12px;overflow:hidden}
.paso button{width:40px;height:38px;border:0;background:var(--rosa-claro);font-size:20px;font-weight:800}
.paso input{flex:1;min-width:0;height:38px;border:0;text-align:center;font-weight:800;font-size:16px;-moz-appearance:textfield}
.paso input::-webkit-inner-spin-button{-webkit-appearance:none}
.fila{display:flex;gap:6px}
.btn{border:2px solid var(--marino);border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px;background:#fff}
.btn.prim{background:var(--marino);color:#fff}
.btn.rosa{background:var(--rosa);color:#fff}
.btn.peligro{border-color:var(--mal);color:var(--mal)}
.btn.verde{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.fila .btn{flex:1}

.sube{display:none;font-size:12px;font-weight:800;color:#8A5300;background:#FFF1D6;border-radius:999px;padding:2px 8px;align-self:flex-start}
body.admin .sube{display:inline-block}
.prog{display:none;height:10px;border-radius:5px;background:var(--rosa-claro);border:2px solid var(--marino);overflow:hidden;margin-bottom:10px}
.prog.on{display:block}
.prog i{display:block;height:100%;width:0;background:var(--rosa);transition:width .3s}
.fotosadm .f.ok::after{content:"✓";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.fotosadm .f.subiendo img{opacity:.45}
/* Cajones (categorías) */
.cajones{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.cajon{position:relative;display:block;width:100%;padding:0;border:2px solid var(--marino);border-radius:20px;overflow:hidden;background:var(--rosa-claro);text-align:left;aspect-ratio:1/1.08}
.cajon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cajon .sinfoto{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--brush);font-size:56px;color:var(--rosa)}
.cajon .rot{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(23,34,59,.88));color:#fff}
.cajon .rot b{display:block;font-family:var(--brush);font-weight:400;font-size:26px;line-height:1.05;text-shadow:1px 1px 0 var(--marino)}
.cajon .rot small{font-weight:700;font-size:13px;opacity:.9}
.cajon .editcat{position:absolute;top:8px;right:8px;display:none;background:#fff;color:var(--marino);border:2px solid var(--marino);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
body.admin .cajon .editcat{display:block}
.cajon.nuevocat{display:none;border-style:dashed;background:#fff}
body.admin .cajon.nuevocat{display:block}
.cajon.nuevocat span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;color:var(--marino);padding:10px}
.cajon.nuevocat span b{display:block;font-size:40px;line-height:1}
.encab{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.volver{border:2px solid var(--marino);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;flex:none}
.encab h2{margin:0;font-family:var(--brush);font-weight:400;font-size:32px;line-height:1;color:var(--marino);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.campo select{display:block;width:100%;margin-top:5px;padding:12px;border:2px solid var(--marino);border-radius:12px;background:#fff;font-size:16px;font-weight:700;-webkit-appearance:none;appearance:none}
.portadaadm{position:relative;width:160px;aspect-ratio:1/1.08;border:2px dashed var(--marino);border-radius:18px;overflow:hidden;background:var(--rosa-claro);display:grid;place-items:center;cursor:pointer;margin-top:6px}
.portadaadm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portadaadm span{font-weight:800;color:var(--marino);text-align:center;padding:8px;position:relative}
.portadaadm.con span{background:rgba(255,255,255,.85);border-radius:999px;padding:4px 10px;align-self:end;margin-bottom:8px;font-size:13px}
.portadaadm input{display:none}
.fotos img{cursor:zoom-in}

/* Acciones de admin dentro de un cajón */
.accadm{display:none;gap:8px;margin:-4px 0 14px}
body.admin .accadm{display:flex}
.accadm .btn{flex:1;padding:11px 8px}
/* Selector de productos existentes */
.grupo{font-weight:800;font-size:13px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.grupo:first-child{margin-top:0}
.opc{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--linea);cursor:pointer}
.opc img{width:54px;height:54px;border-radius:12px;object-fit:cover;border:2px solid var(--marino);flex:none;background:var(--rosa-claro)}
.opc .d{flex:1;min-width:0}
.opc .n{font-weight:800;line-height:1.2}
.opc .s{font-size:13px;color:var(--gris)}
.opc input{position:absolute;opacity:0;pointer-events:none}
.opc .chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--marino);background:#fff;flex:none;display:grid;place-items:center;font-weight:800;color:#fff}
.opc input:checked + .chk{background:var(--rosa);border-color:var(--rosa-hondo)}
.opc input:checked + .chk::after{content:"✓"}
.todos{background:none;border:0;color:var(--rosa-hondo);font-weight:800;font-size:14px;padding:0;margin-bottom:6px}

/* Visor de fotos en grande */
.visor{position:fixed;inset:0;z-index:80;background:#0B0F1A;display:none;flex-direction:column}
.visor.on{display:flex}
.vbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--top)) 14px 10px;color:#fff}
.vbar b{font-family:var(--brush);font-weight:400;font-size:24px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar span{font-weight:800;font-size:14px;opacity:.8;margin:0 10px;flex:none}
.vcerrar{width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font-size:22px;font-weight:800;line-height:1;flex:none}
.vpista{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}
.vpista::-webkit-scrollbar{display:none}
.vpista.fijo{overflow:hidden}
.vslide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vslide img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.vslide.zoom{overflow:auto;display:block;touch-action:pan-x pan-y}
.vslide.zoom img{max-width:none;max-height:none;width:260%;cursor:zoom-out}
.vayuda{text-align:center;color:#fff;opacity:.6;font-size:13px;font-weight:700;padding:10px 0 calc(14px + var(--bottom))}
.nuevo{display:none;position:fixed;right:16px;bottom:calc(100px + var(--bottom));z-index:15;background:var(--marino);color:#fff;border:3px solid #fff;border-radius:999px;padding:13px 20px;font-weight:800;box-shadow:0 6px 18px rgba(23,34,59,.35)}
body.admin .nuevo{display:block}

/* Barra inferior anclada */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--marino);color:#fff;padding:14px 16px calc(14px + var(--bottom));display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:left}
.barra::before{content:"";position:absolute;left:0;right:0;top:-7px;height:7px;background:var(--cordon)}
.ico{position:relative;width:46px;height:46px;border-radius:50%;background:var(--rosa);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px}
.badge{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--marino);font-size:13px;font-weight:800;display:grid;place-items:center;border:2px solid var(--marino)}
.badge.salta{animation:salta .35s}
@keyframes salta{40%{transform:scale(1.35)}}
.barra .txt{flex:1;min-width:0}
.barra .t1{font-weight:800;font-size:16px}
.barra .t2{font-size:13px;opacity:.8}
.barra .tot{font-family:var(--brush);font-size:28px;color:var(--rosa)}

/* Hojas */
.fondo{position:fixed;inset:0;background:rgba(23,34,59,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.fondo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;max-height:calc(92% - var(--top));background:var(--papel);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;border-top:4px solid var(--rosa)}
.hoja.on{transform:none}
.hoja header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.hoja header h2{margin:0;font-family:var(--brush);font-weight:400;font-size:30px;color:var(--marino)}
.cerrar{width:38px;height:38px;border-radius:50%;border:2px solid var(--marino);background:#fff;font-size:20px;font-weight:800;line-height:1}
.cuerpo{overflow-y:auto;padding:4px 18px 16px;-webkit-overflow-scrolling:touch}
.pie{padding:12px 18px calc(14px + var(--bottom));border-top:2px dashed var(--linea);background:#fff}
@media (prefers-reduced-motion:reduce){.hoja,.fondo{transition:none}.agregar.pum,.badge.salta{animation:none}}

/* Carrito */
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.item img{width:62px;height:62px;border-radius:12px;object-fit:cover;border:2px solid var(--marino);flex:none;background:var(--rosa-claro)}
.item .d{flex:1;min-width:0}
.item .n{font-weight:800;line-height:1.2}
.item .s{font-size:14px;color:var(--gris)}
.item .sub{font-weight:800;white-space:nowrap}
.menos{width:38px;height:38px;border-radius:50%;border:2px solid var(--mal);background:#fff;color:var(--mal);font-size:24px;font-weight:800;line-height:1;flex:none}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.total span{font-weight:700;color:var(--gris)}
.total strong{font-family:var(--brush);font-weight:400;font-size:34px;color:var(--marino)}
.ancho{width:100%;padding:14px;font-size:16px;border-radius:14px}
label.campo{display:block;margin:12px 0 0;font-weight:800;font-size:14px;color:var(--marino)}
.campo input,.campo textarea{display:block;width:100%;margin-top:5px;padding:12px;border:2px solid var(--marino);border-radius:12px;background:#fff;font-size:16px;font-weight:600}
.campo textarea{min-height:110px;resize:vertical;font-weight:400}
.error{color:var(--mal);font-weight:700;font-size:14px;min-height:20px;margin:8px 0 0}
.listo{text-align:center;padding:10px 0 4px}
.listo .folio{font-family:var(--brush);font-size:48px;color:var(--rosa);line-height:1}
.listo p{margin:6px 0}

/* Pedidos (admin) */
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.resumen div{background:#fff;border:2px solid var(--marino);border-radius:14px;padding:10px 12px}
.resumen small{display:block;font-weight:700;color:var(--gris);font-size:13px}
.resumen b{font-size:22px}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.chip{border:2px solid var(--marino);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.chip.on{background:var(--marino);color:#fff}
.ped{background:#fff;border:2px solid var(--marino);border-radius:16px;padding:12px;margin-bottom:12px}
.ped .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ped .fol{font-family:var(--brush);font-size:26px;color:var(--rosa-hondo);line-height:1}
.ped .quien{font-weight:800}
.ped .datos{font-size:14px;color:var(--gris)}
.ped .datos a{color:var(--marino);font-weight:800}
.estado{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.estado.pendiente{background:#FFF1D6;color:#8A5300}
.estado.entregado{background:#DDF3E8;color:var(--ok)}
.estado.cancelado{background:#F8E0E0;color:var(--mal)}
.ped .its{margin:8px 0;border-top:1px dashed var(--linea)}
.ped .it{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.ped .it img{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--marino)}
.ped .it span{flex:1}
.ped .tt{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-bottom:8px}

/* Formulario de producto */
.fotosadm{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.fotosadm .f{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:2px solid var(--marino)}
.fotosadm .f img{width:100%;height:100%;object-fit:cover}
.fotosadm .f button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:var(--mal);color:#fff;font-weight:800;font-size:14px;line-height:1}
.fotosadm .f em{position:absolute;left:0;right:0;bottom:0;background:var(--marino);color:#fff;font-size:10px;font-style:normal;text-align:center;font-weight:800}
.subir{aspect-ratio:1/1;border:2px dashed var(--marino);border-radius:12px;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--marino);background:var(--rosa-claro);cursor:pointer}
.subir input{display:none}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* PIN */
.pinbox{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px}
.pinbox.on{display:grid}
.pincard{background:var(--papel);border:3px solid var(--marino);border-radius:22px;padding:22px;width:100%;max-width:320px;text-align:center}
.pincard h2{margin:0 0 4px;font-family:var(--brush);font-weight:400;font-size:30px;color:var(--marino)}
.pincard input{width:100%;text-align:center;font-size:28px;letter-spacing:10px;padding:10px;border:2px solid var(--marino);border-radius:12px;margin:12px 0 4px;font-weight:800}
.pincard .fila{margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(165px + var(--bottom));transform:translate(-50%,20px);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Tipografía formal ===== */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01"}
.marca h1,.info h3,.barra .tot,.hoja header h2,.total strong,.listo .folio,.ped .fol,.pincard h2,.cajon .sinfoto,.cajon .rot b,.encab h2,.vbar b{font-weight:700;font-style:normal;letter-spacing:-.02em;text-shadow:none}
.marca h1{font-size:24px;color:#fff;letter-spacing:-.01em}
.marca p{font-weight:600;font-size:12.5px;letter-spacing:.01em}
.info h3{font-size:16px;line-height:1.25;color:var(--tinta)}
.precio{font-size:18px;font-weight:700;letter-spacing:-.01em}
.stock,.encarrito{font-size:12.5px;font-weight:600}
.carac{font-size:13.5px;line-height:1.5}
.agregar{font-weight:700;font-size:13px;white-space:nowrap;padding:10px 8px}
.barra .t1{font-weight:700;font-size:15px}
.barra .tot{font-size:20px;color:#fff}
.hoja header h2{font-size:22px}
.total strong{font-size:26px}
.listo .folio{font-size:40px;color:var(--marino)}
.ped .fol{font-size:20px;color:var(--marino)}
.pincard h2{font-size:22px}
.cajon .sinfoto{font-size:44px;font-weight:800}
.cajon .rot{padding:30px 12px 11px}
.cajon .rot b{font-size:18px;line-height:1.2}
.cajon .rot small{font-weight:600;font-size:12.5px}
.encab h2{font-size:24px}
.vbar b{font-size:17px}
.btn,.volver,.chip,.salir,.nuevo,.mas,.todos{font-weight:700}
label.campo,.grupo{font-weight:700}
.campo input,.campo textarea,.campo select{font-weight:500}
.item .n,.opc .n,.ped .quien{font-weight:700}
.resumen b{font-weight:700;letter-spacing:-.01em}

/* ===== Tema formal tipo tienda en línea ===== */
:root{--papel:#EAEDED;--tinta:#0F1111;--gris:#565959;--linea:#E3E6E6;--link:#007185;--amarillo:#FFD814;--amarillo-b:#FCD200;--naranja:#FFA41C;--naranja-b:#FF8F00;--oscuro:#131921;--oscuro2:#232F3E;--rojo:#B12704;--verde:#007600}
body{background:var(--papel);color:var(--tinta)}
.top{background:var(--oscuro);flex-wrap:wrap;gap:8px 12px;padding:calc(8px + var(--top)) 12px 0;touch-action:manipulation}
.top::after,.barra::before{display:none}
.logo{width:46px;height:46px;border:2px solid #fff}
.marca h1{font-size:21px;color:#fff}
.marca p{color:#CCCCCC;font-weight:500}
.salir{background:transparent;border:1px solid #fff;border-radius:6px;font-weight:600}
.buscar{flex:1 1 100%;display:flex;height:42px;border-radius:8px;overflow:hidden;background:#fff;border:2px solid transparent;-webkit-user-select:text;user-select:text}
.buscar:focus-within{border-color:var(--naranja)}
.buscar input{flex:1;min-width:0;border:0;outline:0;padding:0 12px;font-size:16px;color:var(--tinta);background:#fff;-webkit-appearance:none;appearance:none}
.buscar button{width:50px;border:0;background:#FEBD69;display:grid;place-items:center}
.buscar svg{width:22px;height:22px}
.nav{flex:1 1 100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--oscuro2);margin:0 -12px;padding:6px 10px}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;background:none;border:1px solid transparent;color:#fff;font-weight:600;font-size:14px;white-space:nowrap;padding:6px 10px;border-radius:3px}
.nav button.on{border-color:#fff}
main{padding:14px 10px 20px}
.version{color:#9AA0A0}
/* cajones */
.cajones{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cajon{aspect-ratio:auto;display:flex;flex-direction:column;background:#fff;border:0;border-radius:6px;padding:12px 12px 14px;box-shadow:0 1px 2px rgba(15,17,17,.08)}
.cajon img{position:static;order:2;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:2px}
.cajon .sinfoto{position:static;order:2;aspect-ratio:1/1;background:#F3F3F3;color:#8D9096;border-radius:2px}
.cajon .rot{position:static;order:1;background:none;color:var(--tinta);padding:0 0 10px}
.cajon .rot b{color:var(--tinta);font-size:17px;line-height:1.25}
.cajon .rot small{color:var(--gris);font-weight:500}
.cajon::after{content:"Ver productos";order:3;margin-top:10px;color:var(--link);font-size:13.5px;font-weight:500}
.cajon.nuevocat{min-height:230px;border:2px dashed #BBBFBF;box-shadow:none}
.cajon.nuevocat::after{display:none}
.cajon .editcat{border:1px solid #D5D9D9;border-radius:6px;font-weight:600;color:var(--tinta);top:10px;right:10px}
/* tarjetas de producto */
.grid{gap:10px}
.prod{border:0;border-radius:6px;box-shadow:0 1px 2px rgba(15,17,17,.08)}
.fotos{background:#fff}
.fotos img{object-fit:contain;padding:6px}
.dots i{box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dots i.on{background:var(--naranja)}
.info{gap:3px;padding:8px 12px 12px}
.info h3{font-weight:500;font-size:15px;line-height:1.3;color:var(--tinta);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.precio{margin-top:2px}
.pr{font-size:26px;font-weight:500;line-height:1;color:var(--tinta);letter-spacing:-.01em}
.pr sup{font-size:12px;font-weight:500;position:relative;top:-.95em;vertical-align:baseline}
.pr sup:first-child{margin-right:1px}
.stock{color:var(--verde);font-weight:500}
.stock.poco,.stock.cero{color:var(--rojo)}
.carac{color:var(--gris)}
.mas{color:var(--link);font-weight:500}
.encarrito{color:var(--link);font-weight:500}
.agregar{margin-top:8px;background:var(--amarillo);border:1px solid var(--amarillo-b);color:var(--tinta);border-radius:100px;font-weight:500;box-shadow:0 2px 5px rgba(213,217,217,.5)}
.agregar b{display:none}
.agregar:disabled{background:#F7F8F8;border-color:#D5D9D9;color:#8D9096;box-shadow:none}
.prod.agotado .fotos{filter:grayscale(1);opacity:.6}
/* barra inferior */
.barra{background:var(--oscuro)}
.ico{background:transparent}
.ico svg{width:30px;height:30px}
.badge{background:transparent;border:0;color:var(--naranja);font-size:16px;top:-6px;right:-4px}
.barra .t2{opacity:.75}
.barra .tot{color:#fff;font-weight:700}
/* hojas y formularios */
.hoja{background:#fff;border-top:0;border-radius:14px 14px 0 0}
.hoja header h2,.encab h2{color:var(--tinta)}
.encab.resultados h2{font-size:17px;font-weight:600;white-space:normal}
.cerrar{border:1px solid #D5D9D9;font-weight:500}
.pie{border-top:1px solid var(--linea)}
.btn{border:1px solid #D5D9D9;border-radius:100px;font-weight:500;box-shadow:0 2px 5px rgba(213,217,217,.5);background:#fff;color:var(--tinta)}
.btn.prim{background:var(--amarillo);border-color:var(--amarillo-b);color:var(--tinta)}
.btn.rosa{background:var(--naranja);border-color:var(--naranja-b);color:var(--tinta)}
.btn.verde{background:#067D62;border-color:#067D62;color:#fff}
.btn.peligro{color:var(--rojo)}
.volver{border:1px solid #D5D9D9;border-radius:8px;font-weight:500;box-shadow:0 2px 5px rgba(213,217,217,.5)}
label.campo{color:var(--tinta);font-weight:600}
.campo input,.campo textarea,.campo select,.pincard input,.paso{border:1px solid #888C8C;border-radius:8px;box-shadow:0 1px 2px rgba(15,17,17,.15) inset}
.campo input:focus,.campo textarea:focus,.campo select:focus,.pincard input:focus{outline:0;border-color:#E77600;box-shadow:0 0 3px 2px rgba(228,121,17,.5)}
.paso button{background:#F0F2F2}
.item img{border:1px solid var(--linea);background:#fff;object-fit:contain}
.menos{border:1px solid #D5D9D9;color:var(--tinta);border-radius:8px;font-size:22px}
.total span{color:var(--tinta)}
.total strong{color:var(--rojo)}
.error{color:var(--rojo)}
.listo .folio{color:var(--verde)}
.ped,.resumen div{border:1px solid #D5D9D9;border-radius:8px}
.ped .fol{color:var(--tinta)}
.ped .datos a{color:var(--link)}
.chip{border:1px solid #D5D9D9;font-weight:500}
.chip.on{background:var(--oscuro2);border-color:var(--oscuro2)}
.fotosadm .f{border:1px solid #D5D9D9}
.fotosadm .f em{background:var(--oscuro2)}
.subir,.portadaadm{border:2px dashed #888C8C;background:#F7F8F8}
.pincard{border:1px solid #D5D9D9;background:#fff}
.nuevo{background:var(--oscuro2);border:2px solid #fff;font-weight:600}
.opc .chk{border:1px solid #888C8C;border-radius:4px}
.opc input:checked + .chk{background:var(--link);border-color:var(--link)}
.todos{color:var(--link)}
.sube{background:#FEF3D7;color:#8A5300}

/* Visitas (admin) */
.visitas{background:#fff;border:1px solid #D5D9D9;border-radius:8px;padding:12px;margin-bottom:12px}
.vtit{font-weight:700;font-size:15px;margin-bottom:8px}
.vnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.vnums div{background:#F7F8F8;border-radius:6px;padding:8px}
.vnums b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.vnums small{font-size:12px;color:var(--gris);font-weight:500}
.vbarras{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:104px;align-items:end}
.vb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.vb span{display:block;width:100%;background:var(--naranja);border-radius:3px 3px 0 0}
.vb i{font-style:normal;font-size:10px;font-weight:700;color:var(--tinta);line-height:1.2;min-height:12px}
.vb em{font-style:normal;font-size:10px;color:var(--gris);margin-top:3px}
.vb:last-child span{background:var(--link)}
.vnota{margin-top:8px;font-size:11.5px;color:var(--gris)}
</style>
</head>

const API = `https://firestore.googleapis.com/v1/${RAIZ}`;
const nuevoId = () => { const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(20)); r.forEach(x=>s+=c[x%62]); return s; };
const nombreDoc = (col,id) => `${RAIZ}/${col}/${id}`;
async function api(metodo, url, cuerpo, ms=40000){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
  try {
    const r = await fetch(url + (url.includes("?")?"&":"?") + "key=" + FB_CONFIG.apiKey, {
      method: metodo, headers: {"Content-Type":"application/json"},
      body: cuerpo ? JSON.stringify(cuerpo) : undefined, signal: ctl.signal, cache: "no-store"
    });
    const j = await r.json().catch(()=>({}));
    if (!r.ok) { const e = new Error((j.error&&j.error.message)||("HTTP "+r.status)); e.code = ((j.error&&j.error.status)||"").toLowerCase().replace(/_/g,"-"); e.http = r.status; throw e; }
    return j;
  } catch(e) {
    if (e.name === "AbortError") throw Object.assign(new Error("TIEMPO"),{code:"timeout"});
    if (!e.code) e.code = "unavailable";
    throw e;
  } finally { clearTimeout(t); }
}
function enc(v){
  if (v === null || v === undefined) return {nullValue:null};
  if (v instanceof Date) return {timestampValue:v.toISOString()};
  if (Array.isArray(v)) return {arrayValue:{values:v.map(enc)}};
  if (typeof v === "boolean") return {booleanValue:v};
  if (typeof v === "number") return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  if (typeof v === "string") return {stringValue:v};
  return {mapValue:{fields:encCampos(v)}};
}
const encCampos = o => Object.fromEntries(Object.entries(o).filter(([,x])=>x!==undefined).map(([k,x])=>[k,enc(x)]));
function dec(v){
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return Number(v.doubleValue);
  if ("booleanValue" in v) return v.booleanValue;
  if ("timestampValue" in v) { const ms = Date.parse(v.timestampValue); return {toMillis:()=>ms}; }
  if ("arrayValue" in v) return (v.arrayValue.values||[]).map(dec);
  if ("mapValue" in v) return decCampos(v.mapValue.fields||{});
  return null;
}
const decCampos = f => Object.fromEntries(Object.entries(f).map(([k,x])=>[k,dec(x)]));
const decDoc = d => ({id:d.name.split("/").pop(), ...decCampos(d.fields||{}), _ver:d.updateTime});
async function listar(col){
  const out = []; let tok = "";
  do { const j = await api("GET", `${API}/${col}?pageSize=300${tok?"&pageToken="+encodeURIComponent(tok):""}`); (j.documents||[]).forEach(d=>out.push(decDoc(d))); tok = j.nextPageToken||""; } while (tok);
  return out;
}
async function leerVarios(col, ids, transaction){
  if (!ids.length) return [];
  const r = await api("POST", `${API}:batchGet`, {documents: ids.map(id=>nombreDoc(col,id)), ...(transaction?{transaction}:{})});
  const mapa = {}; r.forEach(x => { if (x.found) mapa[x.found.name.split("/").pop()] = decDoc(x.found); });
  return ids.map(id => mapa[id] || null);
}
const wGuardar = (col,id,obj,{campos,existe,version}={}) => ({update:{name:nombreDoc(col,id), fields:encCampos(obj)}, ...(campos?{updateMask:{fieldPaths:campos}}:{}), ...(version?{currentDocument:{updateTime:version}}:existe!==undefined?{currentDocument:{exists:existe}}:{})});
const wBorrar = (col,id) => ({delete:nombreDoc(col,id)});
const wSumar = (col,id,campo,n) => ({transform:{document:nombreDoc(col,id), fieldTransforms:[{fieldPath:campo, increment:{integerValue:String(n)}}]}, currentDocument:{exists:true}});
const confirmar = (writes, transaction, ms) => api("POST", `${API}:commit`, {writes, ...(transaction?{transaction}:{})}, ms);

const claveDia = d => "d" + d.replace(/-/g,"");
async function registrarVisita(){
  try { if (localStorage.getItem("brio_es_admin") === "1" || sessionStorage.getItem("brio_admin") === "1") return; } catch(e){}
  if (/#admin/i.test(location.hash)) return;
  const dia = claveDia(hoyISO());
  let nuevo = true;
  try { nuevo = localStorage.getItem("brio_visita") !== dia; } catch(e){}
  const inc = campo => ({fieldPath:campo, increment:{integerValue:"1"}});
  const t = [inc("total"), inc(`dias.${dia}.v`)];
  if (nuevo) t.push(inc("unicos"), inc(`dias.${dia}.u`));
  try {
    await confirmar([{update:{name:nombreDoc("brio_config","visitas"), fields:{}}, updateMask:{fieldPaths:[]}, updateTransforms:t}]);
    try { localStorage.setItem("brio_visita", dia); } catch(e){}
  } catch(e) { console.warn("Visita no registrada", e); }
}
function htmlVisitas(){
  const v = visitas || {}, dias = v.dias || {};
  const fecha = k => { const d = new Date(); d.setDate(d.getDate() - k); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const ult = Array.from({length:14}, (_,k) => { const f = fecha(13-k); const x = dias[claveDia(f)] || {}; return {f, u:Number(x.u)||0, v:Number(x.v)||0}; });
  const hoy = ult[13];
  const semana = ult.slice(7).reduce((a,x)=>a+x.u,0);
  const max = Math.max(1, ...ult.map(x=>x.u));
  const dsem = ["D","L","M","M","J","V","S"];
  return `<div class="visitas">
    <div class="vtit">Visitas al catálogo</div>
    <div class="vnums">
      <div><b>${hoy.u}</b><small>Hoy</small></div>
      <div><b>${semana}</b><small>Últimos 7 días</small></div>
      <div><b>${Number(v.unicos)||0}</b><small>Total visitantes</small></div>
    </div>
    <div class="vbarras" aria-label="Visitantes por día, últimos 14 días">
      ${ult.map(x => { const [y,m,d] = x.f.split("-").map(Number); const dia = new Date(y,m-1,d); return `<div class="vb" title="${dia.toLocaleDateString("es-MX",{day:"numeric",month:"short"})}: ${x.u} visitantes, ${x.v} visitas"><i>${x.u||""}</i><span style="height:${Math.max(2, Math.round(70*x.u/max))}px"></span><em>${dsem[dia.getDay()]}</em></div>`; }).join("")}

}

function ajustarCarritoAlStock(){
  let cambio = false;
  for (const id of Object.keys(carrito)) {
    const p = prod(id);
    if (!p || p.stock <= 0) { delete carrito[id]; cambio = true; }
    else if (carrito[id] > p.stock) { carrito[id] = p.stock; cambio = true; }
  }
  if (cambio) guardarCarrito();
}

function fotosDe(p){
  if (fotosCache[p.id]) return fotosCache[p.id];
  if (p.imagenes && p.imagenes.length) return p.imagenes;
  return p.thumb ? [p.thumb] : [];
}
async function cargarFotos(p){
  if (fotosCache[p.id] || !(p.fotos && p.fotos.length)) return fotosDe(p);
  if (!fotosCargando[p.id]) fotosCargando[p.id] = leerVarios(COL_F, p.fotos).then(ds => ds.map(d => d && d.data)).catch(()=>[])
    .then(arr => { const ok = arr.filter(Boolean); if (ok.length) fotosCache[p.id] = ok; delete fotosCargando[p.id]; return fotosDe(p); });
  return fotosCargando[p.id];
}

    const st = p.stock||0;
    const lleno = enCar >= st;
    const stCls = st<=0 ? "cero" : (st<=3 ? "poco" : "");
    const stTxt = st<=0 ? "Agotado" : st<=3 ? (st===1 ? "Solo queda 1 disponible" : `Solo quedan ${st} disponibles`) : `Disponible · ${st} en existencia`;

        <div class="stock ${stCls}">${stTxt}</div>
        ${p.caracteristicas?`<p class="carac" id="c-${p.id}">${esc(p.caracteristicas)}</p>${p.caracteristicas.length>90||p.caracteristicas.split("\n").length>3?`<button class="mas" data-mas="${p.id}">Ver más</button>`:""}`:""}

          <div class="paso"><button data-st="-1" data-id="${p.id}" aria-label="Restar">−</button><input type="number" inputmode="numeric" min="0" value="${bs}" data-stin="${p.id}" aria-label="Stock"><button data-st="1" data-id="${p.id}" aria-label="Sumar">+</button></div>
          <div class="fila"><button class="btn verde" data-savest="${p.id}" ${bs==st?"disabled":""}>Guardar stock</button><button class="btn" data-edit="${p.id}">Editar</button></div>
        </div>

  }).join("");
  lista.forEach(p => { if (!fotosCache[p.id] && p.fotos && p.fotos.length && !fotosCargando[p.id]) cargarFotos(p).then(() => { if (fotosCache[p.id]) renderCatalogo(); }); });

  }, {passive:true}));

/* ===== Visor de fotos en grande ===== */
function abrirVisor(pid, i){
  const p = prod(pid); if (!p) return;
  const fotos = fotosDe(p); if (!fotos.length) return;
  $("#vNombre").textContent = p.nombre;
  const pista = $("#vPista");
  pista.classList.remove("fijo");
  pista.innerHTML = fotos.map((f,k)=>`<div class="vslide"><img src="${f}" alt="${esc(p.nombre)} foto ${k+1}" data-zoom="1"></div>`).join("");
  const cont = () => { const k = Math.round(pista.scrollLeft / pista.clientWidth); $("#vCont").textContent = fotos.length>1 ? `${k+1} / ${fotos.length}` : ""; };
  pista.onscroll = cont;
  $("#visor").classList.add("on"); document.body.style.overflow = "hidden";
  requestAnimationFrame(() => { pista.scrollLeft = pista.clientWidth * (i||0); cont(); });
  try { history.pushState({brioVisor:1, brioVista:vista}, ""); } catch(e){}
  // Si la foto grande aún no carga (solo miniatura), la trae y actualiza
  if (!fotosCache[p.id] && p.fotos && p.fotos.length) cargarFotos(p).then(arr => { if ($("#visor").classList.contains("on") && fotosCache[p.id]) { const k = Math.round(pista.scrollLeft / pista.clientWidth); abrirVisorSinHistorial(p, arr, k); } });
}
function abrirVisorSinHistorial(p, fotos, k){
  const pista = $("#vPista");
  pista.innerHTML = fotos.map((f,n)=>`<div class="vslide"><img src="${f}" alt="${esc(p.nombre)} foto ${n+1}" data-zoom="1"></div>`).join("");
  requestAnimationFrame(() => { pista.scrollLeft = pista.clientWidth * k; pista.onscroll && pista.onscroll(); });
}
function cerrarVisor(desdeAtras){
  $("#visor").classList.remove("on");
  if (!document.querySelector(".hoja.on")) document.body.style.overflow = "";
  if (!desdeAtras) { try { if (history.state && history.state.brioVisor) history.back(); } catch(e){} }
}
$("#vCerrar").onclick = () => cerrarVisor(false);
$("#vPista").addEventListener("click", e => {
  const img = e.target.closest("img[data-zoom]"); if (!img) return;
  const slide = img.parentElement, pista = $("#vPista");
  if (slide.classList.contains("zoom")) { slide.classList.remove("zoom"); pista.classList.remove("fijo"); return; }
  const r = img.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  slide.classList.add("zoom"); pista.classList.add("fijo");
  requestAnimationFrame(() => {
    slide.scrollLeft = img.offsetWidth * fx - slide.clientWidth / 2;
    slide.scrollTop = img.offsetHeight * fy - slide.clientHeight / 2;
  });
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#visor").classList.contains("on")) cerrarVisor(false); });

async function enviarPedido(btn){
  const nombre = $("#cNombre").value.trim();
  const telefono = $("#cTel").value.replace(/\D/g,"");
  const fecha = $("#cFecha").value;
  const err = $("#cError");
  window._datos = {nombre, telefono:$("#cTel").value, fecha};
  if (nombre.length < 2) return err.textContent = "Escribe tu nombre.";
  if (telefono.length !== 10) return err.textContent = "El teléfono debe tener 10 dígitos.";
  if (!fecha) return err.textContent = "Elige la fecha de entrega.";
  if (fecha < hoyISO()) return err.textContent = "La fecha de entrega no puede ser anterior a hoy.";
  err.textContent = ""; btn.disabled = true; btn.textContent = "Enviando…";
  const lineas = Object.entries(carrito).filter(([id])=>prod(id));
  const pedidoId = nuevoId();
  try {
    let res = null, ultimoError = null;
    // Lee stock y folio, y guarda todo en un solo envío que solo se acepta si nadie
    // modificó esos datos en medio (si alguien sí, se vuelve a leer y reintenta).
    for (let intento = 0; intento < 5 && !res; intento++) {
      const [cont] = await leerVarios("brio_config", ["contador"]);
      const docs = await leerVarios(COL_P, lineas.map(([id])=>id));
      const items = [];
      docs.forEach((d,k) => {
        const cant = lineas[k][1];
        if (!d) throw new Error("AGOTADO|Un producto ya no está disponible");
        if ((d.stock||0) < cant) throw new Error(`AGOTADO|Solo quedan ${d.stock||0} de ${d.nombre}`);
        items.push({id:d.id, nombre:d.nombre, precio:Number(d.precio)||0, cant, thumb:d.thumb||""});
      });
      const total = Math.round(items.reduce((a,i)=>a+i.precio*i.cant,0)*100)/100;
      const folio = (cont ? (Number(cont.n)||0) : 0) + 1;
      const pedido = {folio, nombre, telefono, fechaEntrega:fecha, items, total, estado:"pendiente", creado:ahora()};
      const writes = docs.map((d,k) => wGuardar(COL_P, d.id, {stock:(d.stock||0)-lineas[k][1]}, {campos:["stock"], version:d._ver}));
      writes.push(wGuardar("brio_config","contador",{n:folio}, cont ? {campos:["n"], version:cont._ver} : {existe:false}));
      writes.push(wGuardar(COL_O, pedidoId, pedido));
      try { await confirmar(writes); res = pedido; }
      catch(e) {
        ultimoError = e;
        const reintentable = e.code==="failed-precondition" || e.code==="aborted" || e.code==="already-exists" || e.code==="unavailable" || e.code==="timeout";
        if (!reintentable) throw e;
        await new Promise(r=>setTimeout(r, 300 + Math.random()*500));
      }
    }
    if (!res) throw ultimoError || new Error("sin respuesta");
    ultimoPedido = res; carrito = {}; guardarCarrito(); window._datos = null;
    pasoCarrito = "listo"; renderCarrito(); renderBarra(); renderCatalogo(); cargarCatalogo();
  } catch(e) {
    btn.disabled = false; btn.textContent = "Enviar pedido";
    const m = String(e.message||"");
    const sinRed = e.code==="unavailable" || e.code==="timeout";
    err.textContent = m.startsWith("AGOTADO|") ? m.split("|")[1] + ". Ajusta tu carrito." :
      sinRed ? "No se pudo enviar el pedido. Revisa tu conexión e intenta de nuevo." :
      "No se pudo enviar el pedido, intenta de nuevo. (" + (e.http||"") + " " + (e.code||"") + ")";
    if (m.startsWith("AGOTADO|")) {
      avisoCarrito = m.split("|")[1] + ". Ajustamos tu carrito a lo disponible.";
      pasoCarrito = "lista";
      await cargarCatalogo(); renderCarrito();
    }
    console.error(e);
  }
}

function cargarImg(src){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; }); }
async function comprimir(src, max, q){
  const img = await cargarImg(src);
  const r = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth*r); c.height = Math.round(img.naturalHeight*r);
  const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg", q);
}
async function thumbCuadrado(src){
  const img = await cargarImg(src);
  const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
  c.width = c.height = 160;
  c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,160,160);
  return c.toDataURL("image/jpeg",0.7);
}

function abrirProducto(id){
  const p = id ? prod(id) : null;
  edit = {id: id||null, nuevoId: id ? null : nuevoId(), fotos: [], originales: p && p.fotos ? [...p.fotos] : []};
  if (p) {
    if (p.fotos && p.fotos.length) edit.fotos = p.fotos.map((fid,i)=>({id:fid, data:(fotosCache[p.id]||[])[i]||p.thumb||""}));
    else edit.fotos = (p.imagenes||[]).map(d=>({id:null, data:d}));
    if (p.fotos && p.fotos.length && !fotosCache[p.id]) cargarFotos(p).then(arr => { if (edit && edit.id===p.id && fotosCache[p.id]) { edit.fotos.forEach((f,i)=>{ if (f.id===p.fotos[i]) f.data = arr[i]||f.data; }); renderFotosAdm(); } });
  }
  $("#prodTit").textContent = p ? "Editar producto" : "Nuevo producto";
  $("#pNombre").value = p ? p.nombre : "";
  $("#pPrecio").value = p ? p.precio : "";
  $("#pStock").value = p ? p.stock : "";
  $("#pCarac").value = p ? (p.caracteristicas||"") : "";
  const sel = $("#pCat");
  $("#pCatCampo").style.display = categorias.length ? "block" : "none";
  sel.innerHTML = `<option value="">Sin cajón (Más productos)</option>` + categorias.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("");
  const actual = p ? (p.categoria||"") : (vista && vista!=="_sin" && vista!=="_todos" ? vista : (categorias[0] ? categorias[0].id : ""));
  sel.value = categorias.some(c=>c.id===actual) ? actual : "";
  $("#pError").textContent = "";
  $("#pEliminar").style.display = p ? "block" : "none";
  $("#pGuardar").disabled = false; $("#pGuardar").textContent = "Guardar producto";
  $("#prog").classList.remove("on"); $("#progI").style.width = "0";
  renderFotosAdm(); abrir("#hProd");
}
function renderFotosAdm(){
  const f = edit.fotos;
  $("#fcount").textContent = `(${f.length} de ${MAX_FOTOS})`;
  $("#fotosadm").innerHTML = f.map((ft,i)=>`<div class="f ${ft.ok?"ok":""} ${ft.subiendo?"subiendo":""}"><img src="${ft.data}" alt=""><button data-quitafoto="${i}" aria-label="Quitar foto">×</button>${i===0?"<em>Portada</em>":""}</div>`).join("")
    + (f.length < MAX_FOTOS ? `<label class="subir">+<input type="file" accept="image/*" multiple id="fileIn"></label>` : "");
  const fi = $("#fileIn");
  if (fi) fi.onchange = async e => {
    const files = [...e.target.files].slice(0, MAX_FOTOS - edit.fotos.length);
    $("#pError").textContent = files.length ? "Procesando fotos…" : "";
    for (const file of files) {
      const url = URL.createObjectURL(file);
      try { edit.fotos.push({id:null, data: await comprimir(url, 800, 0.68)}); } catch(err){ $("#pError").textContent = "Una foto no se pudo leer. Prueba con otra."; }
      URL.revokeObjectURL(url);
    }
    if ($("#pError").textContent === "Procesando fotos…") $("#pError").textContent = "";
    renderFotosAdm();
  };
}
async function guardarProducto(){
  const nombre = $("#pNombre").value.trim();
  const precio = parseFloat($("#pPrecio").value);
  const stock = parseInt($("#pStock").value,10);
  const caracteristicas = $("#pCarac").value.trim();
  const err = $("#pError");
  if (!edit.fotos.length) return err.textContent = "Agrega al menos una foto.";
  if (!nombre) return err.textContent = "Escribe el nombre del producto.";
  if (!(precio >= 0)) return err.textContent = "Escribe un precio válido.";
  if (!(stock >= 0)) return err.textContent = "Escribe las unidades en stock (0 o más).";
  const btn = $("#pGuardar"); btn.disabled = true; err.textContent = "";
  $("#pEliminar").disabled = true;
  const pid = edit.id || edit.nuevoId;
  const nuevas = edit.fotos.filter(f => !f.id || !f.ok && !(edit.originales||[]).includes(f.id));
  const pasos = nuevas.length + 1;
  let hechos = 0;
  const avanza = () => { $("#progI").style.width = Math.round(100*hechos/pasos) + "%"; };
  $("#prog").classList.add("on"); avanza();
  // Las fotos que ya estaban publicadas cuentan como subidas
  edit.fotos.forEach(f => { if (f.id && (edit.originales||[]).includes(f.id)) f.ok = true; });
  try {
    // 1) Fotos, una por una, cada una confirmada por el servidor antes de seguir
    let n = 0;
    for (const f of edit.fotos) {
      if (f.ok) continue;
      n++;
      btn.textContent = `Subiendo foto ${n} de ${nuevas.length}…`;
      f.subiendo = true; renderFotosAdm();
      if (f.data.length > 350000) f.data = await comprimir(f.data, 700, 0.6);
      if (!f.id) f.id = nuevoId();
      await confirmar([wGuardar(COL_F, f.id, {data:f.data, producto:pid})], null, 60000);
      f.subiendo = false; f.ok = true; hechos++; avanza(); renderFotosAdm();
    }
    // 2) La publicación, con todas sus fotos juntas
    btn.textContent = "Publicando…";
    const thumb = await thumbCuadrado(edit.fotos[0].data);
    const ids = edit.fotos.map(f=>f.id);
    const data = {nombre, precio:Math.round(precio*100)/100, stock, caracteristicas, categoria:$("#pCat").value||"", fotos:ids, thumb, actualizado:ahora()};
    if (!edit.id) { data.creado = ahora(); data.alta = Date.now(); }
    fotosCache[pid] = edit.fotos.map(f=>f.data);
    await confirmar([wGuardar(COL_P, pid, data, {campos:[...Object.keys(data), "imagenes"]})]);
    hechos++; avanza();
    const quitar = (edit.originales||[]).filter(fid => !ids.includes(fid));
    if (quitar.length) confirmar(quitar.map(fid => wBorrar(COL_F, fid))).catch(()=>{});
    const local = {id:pid, ...data}; const i = productos.findIndex(x=>x.id===pid);
    if (i >= 0) productos[i] = {...productos[i], ...local}; else productos.unshift(local);
    cargado = true;
    delete borradorStock[pid];
    const eraNuevo = !edit.id;
    $("#pEliminar").disabled = false;
    cerrarTodo(); renderCatalogo(); renderBarra();
    toast(eraNuevo ? "✓ Producto publicado" : "✓ Producto actualizado");
  } catch(e){
    edit.fotos.forEach(f => f.subiendo = false); renderFotosAdm();
    btn.disabled = false; btn.textContent = "Reintentar (continúa donde se quedó)";
    $("#pEliminar").disabled = false;
    err.textContent = e.http===404 ? "Firebase dice que la base de datos no existe en catalogobriof." :
                      e.http===403 ? "Firebase bloqueó la escritura: faltan publicar las reglas." :
                      "Se cortó la conexión. Toca Reintentar.";
    console.error(e);
  }
}
async function eliminarProducto(){
  const btn = $("#pEliminar");
  if (btn.dataset.confirma !== "1") { btn.dataset.confirma = "1"; btn.textContent = "Toca otra vez para eliminar"; setTimeout(()=>{btn.dataset.confirma=""; btn.textContent="Eliminar producto";},3000); return; }
  btn.dataset.confirma=""; btn.disabled = true; btn.textContent="Eliminando…";
  const p = prod(edit.id);
  try {
    await confirmar([wBorrar(COL_P, edit.id), ...((p && p.fotos) || []).map(fid => wBorrar(COL_F, fid))]);
    productos = productos.filter(x=>x.id!==edit.id); delete fotosCache[edit.id];
    cerrarTodo(); renderCatalogo(); toast("✓ Producto eliminado");
  } catch(e) { console.error(e); toast("Sin conexión, toca otra vez"); }
  btn.disabled = false; btn.textContent="Eliminar producto";
}
$("#pGuardar").onclick = guardarProducto;
$("#pEliminar").onclick = eliminarProducto;
$("#nuevo").onclick = () => abrirProducto(null);

/* ===== Barra ===== */
$("#barra").onclick = () => {
  if (admin) { renderPedidos(); abrir("#hPedidos"); cargarPedidos(); actualizarVisitas(); }
  else { if (pasoCarrito!=="datos") pasoCarrito = "lista"; renderCarrito(); abrir("#hCarrito"); }
};

/* ===== Delegación de eventos ===== */
document.addEventListener("click", e => {
  const ver = e.target.closest("img[data-ver]");
  if (ver) return abrirVisor(ver.dataset.ver, Number(ver.dataset.i));
  if (!e.target.closest("button")) {
    const caj = e.target.closest("[data-cat]"); if (caj) return irA(caj.dataset.cat);
    const nc = e.target.closest("[data-nuevacat]"); if (nc) return abrirCajon(null);
  }
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if ("cerrar" in d) return cerrarTodo();
  if (d.add) {
    const p = prod(d.add); if (!p) return;
    const c = carrito[d.add]||0;
    if (c >= p.stock) return toast(`Solo hay ${p.stock} disponibles`);
    carrito[d.add] = c+1; guardarCarrito();
    renderCatalogo(); renderBarra();
    const nb = document.querySelector(`[data-add="${d.add}"]`); if (nb) nb.classList.add("pum");
    return;
  }
  if (d.menos) {
    const c = (carrito[d.menos]||0) - 1;
    if (c > 0) carrito[d.menos] = c; else delete carrito[d.menos];
    guardarCarrito(); renderCarrito(); renderBarra(); renderCatalogo(); return;
  }
  if (b.id === "aDatos") { avisoCarrito = ""; pasoCarrito = "datos"; renderCarrito(); return; }
  if (b.id === "aLista") { pasoCarrito = "lista"; renderCarrito(); return; }
  if (b.id === "enviar") return enviarPedido(b);
  if (d.mas) { const c = document.getElementById("c-"+d.mas); const ab = c.classList.toggle("abierta"); b.textContent = ab?"Ver menos":"Ver más"; return; }
  if (d.st) {
    const p = prod(d.id); const v = Math.max(0,(parseInt(borradorStock[d.id] ?? p.stock,10)||0) + Number(d.st));
    borradorStock[d.id] = v; renderCatalogo(); return;
  }
  if (d.savest) return guardarStock(d.savest, b);
  if (d.edit) return abrirProducto(d.edit);
  if (d.editcat) { e.stopPropagation(); return abrirCajon(d.editcat); }
  if (d.nuevacat) return abrirCajon(null);
  if (d.navcat !== undefined) { if (busqueda) limpiarBusqueda(); irA(d.navcat || null); b.scrollIntoView({inline:"center", block:"nearest"}); return; }
  if (d.limpiar) return limpiarBusqueda();
  if (d.prodnuevo) return abrirProducto(null);
  if (d.existentes) return abrirExistentes();
  if (d.todossin) { let el = b.nextElementSibling; const lista = []; while (el && el.classList.contains("opc")) { lista.push(el.querySelector("input")); el = el.nextElementSibling; } const marcar = lista.some(i=>!i.checked); lista.forEach(i=>i.checked = marcar); b.textContent = marcar ? "Quitar selección" : "Seleccionar todos"; contarExistentes(); return; }
  if (d.volver) { if (history.state && history.state.brioVista) history.back(); else irA(null); return; }
  if (d.filtro) { filtro = d.filtro; renderPedidos(); return; }
  if (d.entregar) return entregar(d.entregar, b);
  if (d.cancelar) return cancelar(d.cancelar, b);
  if (d.quitafoto !== undefined) { edit.fotos.splice(Number(d.quitafoto),1); renderFotosAdm(); return; }
});
document.addEventListener("input", e => {
  const id = e.target.dataset && e.target.dataset.stin;
  if (id) {
    borradorStock[id] = Math.max(0, parseInt(e.target.value,10)||0);
    const sb = document.querySelector(`[data-savest="${id}"]`); const p = prod(id);
    if (sb && p) sb.disabled = borradorStock[id] === p.stock;
  }
});

renderBarra();
</script>
